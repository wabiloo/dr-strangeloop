output:
  file: outputs/output_with_markers.ts
  resolution: 1920x1080
  framerate: 25
  bitrate_kbps: 10000
  gop: 50
  service_provider: broadpeak
  service_name: broadpeak.io
normalize: false
assets:
- file: content.mp4
  start: 00:00:00
  duration: 10 min
- file: ad_placeholder.mp4
  id: ad1
  duration: 2 min
- file: content.mp4
  start: 10 min
  duration: 10 min
- file: ad_placeholder.mp4
  id: ad2
  duration: 2 min
- file: content.mp4
  start: 20 min
markers:
- event_id: 1
  splice_type: splice_insert
  assets:
  - ad1
- event_id: 2
  splice_type: time_signal
  assets:
  - ad2
  segmentation:
    type_id: '0x34'
    upid_type: '0x09'
    upid_hex: 53 49 47 4e 41 4c 3a 43 52
    web_delivery_allowed: true
    no_regional_blackout: false
    archive_allowed: false
    device_restrictions: 1
