config_version = 2

[deploy]
name = "solitaire-figaro"
backend = "ecs-express"

[infrastructure.aws]
region = "eu-west-1"

[infrastructure.s3]
bucket_name = "bpkio-cs-demos"
content_folder = "its-a-live/content"

[input]
source_path = "/Users/fabrelambeau/Broadpeak/Code/outputs/sailing.ts"
source_kind = "playlist"
allow_missing_segments = false

[markers]
increment_event_ids = false

[markers.hls]
descriptor_grouping      = "shared"
cue_tags            = "none"
id_template = "{segcode}-{eventid}-{loop}"

[markers.dash]
signal_format  = "binary"
descriptor_grouping = "shared"

[packaging]
segment_duration   = 4.0
dvr_window = 30.0

[packaging.hls]
container = "cmaf"
mux_audio = true

[timeline]
continuous = true

[infrastructure.express]
port   = 8080
cpu    = 256
memory = 512
