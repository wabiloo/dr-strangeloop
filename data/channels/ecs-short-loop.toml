config_version = 2

[deploy]
name = "ecs-short-loop"
backend = "ecs-express"

[infrastructure.aws]
region = "eu-west-1"

[infrastructure.s3]
bucket_name = "bpkio-cs-demos"
content_folder = "its-a-live/content"

[input]
source_path = "/Users/fabrelambeau/Broadpeak/Code/dr-strangeloop/outputs/short-loop.ts"

[markers]
increment_event_ids = false

[markers.hls]
descriptor_grouping      = "shared"
cue_tags            = "none"

[packaging]
segment_duration   = 4.0
dvr_window = 30.0

[infrastructure.express]
port   = 8080
cpu    = 256
memory = 512
