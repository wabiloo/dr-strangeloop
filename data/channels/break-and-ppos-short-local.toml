config_version = 2

[deploy]
name = "break-and-ppos-short-local"
backend = "local-docker"

[infrastructure.aws]
region = "eu-west-1"

[infrastructure.s3]
bucket_name = ""
content_folder = "its-a-live/content"

[input]
source_path = "../outputs/break-and-ppos-short.ts"
source_kind = "playlist"
allow_missing_segments = false

[markers]
increment_event_ids = true

[markers.hls]
descriptor_grouping      = "shared"
cue_tags            = "none"
id_template = "{segcode}-{eventid}-{loop}"

[markers.dash]
signal_format  = "binary"
descriptor_grouping = "shared"

[packaging]
segment_duration   = 4.0
dvr_window = 30.0

[packaging.hls]
container = "cmaf"
mux_audio = true

[packaging.dash]
addressing = "time"
timeline_style = "compact"

[timeline]
continuous = false
epoch = "2026-01-01T00:00:00Z"

[infrastructure.docker]
port = "auto"

[query]
start_param      = "start"
end_param        = "end"
timeshift          = true
overrides          = true

[timeshift]
max_span_seconds = 21600
