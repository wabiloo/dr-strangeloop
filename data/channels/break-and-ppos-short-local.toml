[deploy]
name = "break-and-ppos-short-local"
backend = "local-docker"

[aws]
region = "eu-west-1"

[s3]
bucket_name = ""
content_folder = "its-a-live/content"

[input]
source_path = "../outputs/break-and-ppos-short.ts"

[markers]
daterange_mode      = "narrowed"
cue_tags            = "alongside"
increment_event_ids = true

[packaging]
segment_duration   = 4.0
dvr_window_seconds = 30.0

[docker]
port = 8092
