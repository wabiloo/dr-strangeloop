config_version = 2

[deploy]
name = "break-and-ppos-local"
backend = "local-docker"

[infrastructure.aws]
region = "eu-west-1"

[infrastructure.s3]
bucket_name = ""
content_folder = "its-a-live/content"

[input]
source_path = "../outputs/break-and-ppos.ts"
source_kind = "playlist"
allow_missing_segments = false

[markers]
increment_event_ids = true

[markers.hls]
descriptor_grouping      = "shared"
cue_tags            = "none"
id_template = "{segcode}-{eventid}-{loop}"

[markers.dash]
signal_format  = "binary"
descriptor_grouping = "shared"

[packaging]
segment_duration   = 4.0
dvr_window = 30.0

[packaging.hls]
container = "cmaf"
mux_audio = true

[timeline]
continuous = true

[infrastructure.docker]
port = "auto"
