[deploy]
name = "test-from-manifest"
backend = "local-docker"

[aws]
region = "eu-west-1"

[s3]
bucket_name = ""
content_folder = "its-a-live/content"

[input]
source_path = "/Users/fabrelambeau/Broadpeak/Code/dr-strangeloop/outputs/manifests/origin.ridgeline.fr_index/manifest.json"
source_kind = "manifest"
allow_missing_segments = false

[markers]
daterange_mode      = "shared"
cue_tags            = "none"
increment_event_ids = true
daterange_id_format = "{segcode}-{eventid}-{loop}"
dash_signal_format  = "binary"
dash_descriptor_mode = "shared"

[packaging]
segment_duration   = 4.0
dvr_window_seconds = 120.0
hls_format = "cmaf"
hls_ts_mux_audio = true

[timeline]
continuous = true

[docker]
port = "auto"
