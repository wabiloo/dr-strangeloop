[deploy]
name = "short-loop-splice-insert"
backend = "local-docker"

[aws]
region = "eu-west-1"

[s3]
bucket_name = ""
content_folder = "its-a-live/content"

[input]
source_path = "/Users/fabrelambeau/Broadpeak/Code/dr-strangeloop/outputs/short-loop-splice-insert.ts"

[markers]
