[project]
name = "loop-console"
version = "0.1.0"
description = "Dr. Strangeloop: web console to define, launch, and monitor dr-strangeloop channels."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.12",
    "uvicorn>=0.34.3",
    "pydantic>=2.11.7",
    "PyYAML>=6.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.28.1",
    "franken-ts",
]

[tool.uv.sources]
franken-ts = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]

[tool.pytest.ini_options]
pythonpath = "src"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loop_console"]
