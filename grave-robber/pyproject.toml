[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grave-robber"
version = "0.1.0"
description = "Derive loop-dee-loop timing + SCTE-35 markers from a captured HTTP archive (HAR/Proxyman) of a real HLS/DASH session"
requires-python = ">=3.11"
dependencies = [
    "m3u8>=6.0",
    "threefive>=3.0,<4",
    "trace-shrink",
    "mpd-inspector",
]

[project.scripts]
grave-robber = "grave_robber.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]

[tool.uv.sources]
# Separate GitHub repos (not part of this repo's uv workspace) -- see
# SCOPE.md §3 and root AGENTS.md's "Environments" section.
trace-shrink = { git = "https://github.com/wabiloo/trace-shrink" }
mpd-inspector = { git = "https://github.com/wabiloo/mpd-inspector" }
