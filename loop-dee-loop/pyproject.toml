[project]
name = "loop-dee-loop"
version = "0.1.0"
description = "Bake franken-ts outputs into loopable HLS packages and serve them"
requires-python = ">=3.11"
dependencies = [
    "threefive>=2.4",
    "flask>=3.0",
    "gunicorn>=21.2",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    # Not a runtime dependency (see scte35_table23_data.py's header) --
    # only used by test_scte35_tables_sync.py (via
    # scripts/generate_scte35_tables.py) to check the generated local
    # copy against its canonical source.
    "scte35-table23",
]

[tool.uv.sources]
scte35-table23 = { workspace = true }

[tool.uv]
package = false
