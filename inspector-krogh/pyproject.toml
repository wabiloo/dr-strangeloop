[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inspector-krogh"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=9.0",
    "rich>=13.0",
]

[project.scripts]
frame-extractor = "frame_extractor:main"
krogh = "krogh:main"

[tool.hatch.build.targets.wheel]
packages = ["."]
include = ["frame_extractor.py", "krogh.py", "krogh_common.py", "krogh_expected.py", "scte35_report_html.py", "scte35_filmstrip_html.py", "scte35_tables.py"]
