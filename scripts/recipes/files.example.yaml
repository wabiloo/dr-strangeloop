# Recipe for scripts/make_ad_loop.py: a loop made from real video files.
# The content file is cut in two around the break (start/duration), and the
# ad plays in between.
#
#   uv run python scripts/make_ad_loop.py my-loop \
#       --recipe scripts/recipes/files.example.yaml
#   uv run franken-ts data/playlists/my-loop.yaml --verify
ad_breaks:
  content: /media/show.mp4          # file or https URL
  ad: /media/ad-30s.mp4             # ad video, or a slate image
  next_break_delay_s: 60
  break_duration_s: 30
  content_start_s: 0                # where in the content file the loop starts
  ad_start_s: 0                     # where in the ad file to start
  splice_type: splice_insert
  event_id: 1

resolution: 1920x1080
framerate: 25
gop: 50
bitrate_kbps: 5000
