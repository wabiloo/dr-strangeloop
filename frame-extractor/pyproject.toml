[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "frame-extractor"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=9.0",
    "rich>=13.0",
]

[project.scripts]
frame-extractor = "frame_extractor:main"

[tool.hatch.build.targets.wheel]
packages = ["."]
include = ["frame_extractor.py"]
