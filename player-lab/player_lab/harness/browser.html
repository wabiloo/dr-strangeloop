<!doctype html>
<html><head><meta charset="utf-8"><title>Playback Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
button,input,select,textarea{font-family:inherit}
body{margin:0;padding:1.25rem;min-height:100vh;font:14px/1.45 "Space Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#f1f5f9;background:#0b1220}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.playback-panel{display:flex;flex-direction:column;gap:1rem;max-width:1500px;margin:0 auto}
.playback-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.5rem}
.playback-header h3{margin:0;font-size:1.05rem;color:#f8fafc;display:flex;align-items:center;gap:.5rem}
.live-dot{color:#facc15;font-size:.55rem;animation:pulse 1.6s ease-in-out infinite}
.live-dot.idle{animation:none;color:#64748b}
.live-dot.ok{animation:none;color:#4ade80}
.live-dot.bad{animation:none;color:#f87171}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.playback-stats{display:flex;gap:.4rem;flex-wrap:wrap}
.stat-pill{display:inline-flex;align-items:baseline;gap:.4rem;background:#f1f5f9;border-radius:999px;padding:.3rem .75rem;font-size:.75rem;white-space:nowrap}
.stat-pill-label{font-weight:700;text-transform:uppercase;font-size:.62rem;letter-spacing:.03em}
.l-channel{color:#3b6ea5}.l-elapsed{color:#3f8f7f}.l-bound{color:#b07a2e}.l-status{color:#8467a8}
.stat-pill-value{color:#0f172a;font-weight:700;font-variant-numeric:tabular-nums}
.stat-pill-value.ok{color:#15803d}.stat-pill-value.bad{color:#b91c1c}
.note{font-size:.75rem;color:#94a3b8}
.players-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1rem}
.player-card{display:flex;flex-direction:column;gap:.55rem;min-width:0}
.player-card.fail .video-wrapper{outline:2px solid rgba(248,113,113,.7)}
.player-card.pass .video-wrapper{outline:2px solid rgba(74,222,128,.55)}
.player-card.disabled{opacity:.45;align-self:start}
.verdict.skip{background:rgba(148,163,184,.18);color:#94a3b8}
.player-card-header{display:flex;align-items:center;justify-content:space-between;gap:.5rem;color:#cbd5e1}
.player-card-header strong{font-size:.85rem;color:#e2e8f0}
.player-card-header>span:first-child{display:flex;align-items:center;white-space:nowrap}
.logo{height:24px;width:auto;max-width:120px;object-fit:contain;vertical-align:middle;margin-right:.6rem;filter:brightness(0) invert(1)}
.verdict{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:.15rem .55rem;border-radius:999px}
.verdict.pass{background:rgba(74,222,128,.18);color:#4ade80}
.verdict.fail{background:rgba(248,113,113,.18);color:#f87171}
.verdict.run{background:rgba(148,163,184,.18);color:#cbd5e1}
.video-wrapper{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:6px;overflow:hidden}
.video-wrapper iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.video-wrapper .gone{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#64748b;font-size:.8rem}
.playback-meta-panel{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:.2rem 1.25rem;padding-top:.5rem;border-top:1px solid rgba(148,163,184,.16);color:#cbd5e1}
.meta-col{display:flex;flex-direction:column;gap:.35rem;min-width:0}
.playhead-chip{display:flex;align-items:center;gap:.45rem;color:#94a3b8;font-size:.7rem}
.playhead-chip>i{font-style:normal;color:#60a5fa;font-size:.75rem;width:.9rem;text-align:center}
.playhead-chip.good>i{color:#4ade80}
.playhead-chip.warn>i{color:#fbbf24}
.playhead-chip.orange>i{color:#fb923c}
.playhead-chip.orange.hot .playback-meta-value{color:#fb923c;font-weight:700}
.playback-meta-label{color:#94a3b8}
.playback-meta-value{margin-left:auto;white-space:nowrap;color:#e2e8f0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.72rem;font-variant-numeric:tabular-nums}
.format-panels{display:flex;flex-direction:column;gap:2rem}
.format-panel{--accent:#94a3b8;display:flex;flex-direction:column;gap:.9rem;min-width:0;padding-left:1rem;border-left:4px solid var(--accent)}
.format-panel.hls{--accent:#a78bfa}
.format-panel.dash{--accent:#38bdf8}
.format-head{display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.format-head h4{margin:0;font-size:1.25rem;letter-spacing:.06em;color:var(--accent)}
.format-head .url-row{flex:1;min-width:260px}
.players-grid{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.url-row{display:flex;align-items:center;gap:.5rem;background:rgba(148,163,184,.1);border-radius:8px;padding:.3rem .3rem .3rem .75rem;color:#e2e8f0;font-size:.7rem;line-height:1.3}
.url-row .u{flex:1;min-width:0;word-break:break-all;user-select:all}
.copy{flex:none;background:none;border:0;border-radius:6px;padding:.3rem .45rem;cursor:pointer;color:#f87171;font-size:.85rem;line-height:1}
.copy:hover{background:rgba(248,113,113,.15)}
.copy.done{color:#4ade80}
.cfg-row{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:-.4rem}
.cfg-chip{display:inline-flex;gap:.4rem;align-items:baseline;background:rgba(148,163,184,.1);border-radius:6px;padding:.15rem .55rem;font-size:.7rem;color:#94a3b8}
.cfg-chip b{font-weight:500;color:var(--accent)}
.failures{font-size:.75rem;color:#fca5a5;display:flex;flex-direction:column;gap:.15rem}
.failures .w{color:#fcd34d}
.banner{padding:.6rem .9rem;border-radius:8px;background:rgba(96,165,250,.12);border:1px solid rgba(96,165,250,.3);color:#bfdbfe;font-size:.8rem}
.banner.bad{background:rgba(248,113,113,.12);border-color:rgba(248,113,113,.4);color:#fecaca}
.banner.ok{background:rgba(74,222,128,.1);border-color:rgba(74,222,128,.35);color:#bbf7d0}
.banner a{color:inherit}
</style></head><body>
<div class="playback-panel">
  <div class="playback-header">
    <h3><span id="dot" class="live-dot">●</span><span>Playback Lab</span></h3>
    <div class="playback-stats" id="stats"></div>
  </div>
  <div id="banner" class="banner"></div>
  <div class="format-panels" id="panels"></div>
</div>
<script type="module" src="./browser.js"></script>
</body></html>
