# Run the whole dr-strangeloop console (igor + franken-ts + its-a-live +
# loop-dee-loop's local-docker toolchain) with nothing installed locally
# except Docker itself. See DOCKER_LOCAL.md for the full explanation --
# in short:
#
#   1. copy .env.example to .env and fill in HOST_REPO_ROOT/MEDIA_ROOT
#   2. docker compose up --build
#   3. open http://localhost:8090/admin/
#
# The image is fixed/shared: every colleague's checkout lands at the same
# in-container path (/repo, see igor/Dockerfile) regardless of where it
# actually lives on their machine. HOST_REPO_ROOT is only needed at runtime,
# for two things: (1) as the bind mount's source below, and (2) so
# its-a-live/_host_paths.py can translate an in-container path back to its
# real host equivalent at the couple of call sites that hand a path to a
# nested `docker build`/`docker run` (local-docker's own container, and
# ecs-express's `cdk deploy`, which builds/pushes a Docker image) --
# necessary because those commands go through the *host's* Docker daemon
# via the socket mounted below, which resolves every path it's given
# against the host filesystem, with no knowledge this container's mount
# namespace even exists. Get HOST_REPO_ROOT wrong and franken-ts builds
# still work fine (no nested docker involved), but local-docker channels
# and `cdk deploy` fail, or silently bind-mount/build an empty directory.

services:
  igor:
    build:
      context: .
      dockerfile: igor/Dockerfile
    image: dr-strangeloop-igor:local
    environment:
      # REPO_ROOT: this container's own (fixed) view of the repo -- always
      # /repo, matching the Dockerfile/entrypoint. HOST_REPO_ROOT: the same
      # repo's real path on your machine. _host_paths.py needs both to
      # translate between them; neither is meant to be customized per
      # colleague the way HOST_REPO_ROOT's *value* is.
      REPO_ROOT: /repo
      HOST_REPO_ROOT: ${HOST_REPO_ROOT:?set HOST_REPO_ROOT in .env -- see .env.example}
      # Default landing directory for the asset file-browser/picker --
      # scoped to whatever's bind-mounted below, since that's all this
      # container can see anyway. See igor/src/igor/integrations/files.py.
      IGOR_ASSET_ROOT: /media/library
      # AWS creds: either mount ~/.aws below (uses your existing profiles)
      # or set these directly here / in .env -- both are read by the same
      # ambient boto3.session.Session() its-a-live/channel.py already uses
      # (see CLOUD_DEPLOYMENT.md workstream 3 -- unchanged here, this is
      # still a trusted-operator tool, not a multi-tenant one).
      AWS_PROFILE: ${AWS_PROFILE:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_DEFAULT_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    ports:
      - "${IGOR_PORT:-8090}:8090"
    volumes:
      # Target is the fixed /repo the image was built with; source is
      # wherever this colleague actually cloned the repo -- no longer
      # required to match (see the note above and _host_paths.py).
      - ${HOST_REPO_ROOT:?set HOST_REPO_ROOT in .env -- see .env.example}:/repo
      # Lets its-a-live's local-docker backend (and ecs-express's `cdk
      # deploy`, which builds/pushes a Docker image for the ECS task) drive
      # the HOST's Docker install as a sibling, not a nested daemon --
      # Docker-in-Docker/privileged mode is deliberately avoided.
      - /var/run/docker.sock:/var/run/docker.sock
      # Your own source media (videos, slates, images) -- franken-ts
      # playlists should reference paths under /media/library, e.g.
      # /media/library/ads/spot-01.mp4. Read-only: nothing here writes back
      # to your source library.
      - ${MEDIA_ROOT:?set MEDIA_ROOT in .env to a directory holding your source video/slates}:/media/library:ro
      # Optional: reuse AWS CLI profiles/SSO cache from your host instead of
      # the env vars above. Read-only -- `aws configure`/`aws sso login` on
      # the HOST, not inside the container.
      - ${HOME}/.aws:/root/.aws:ro
      # franken-ts's default cache dir (~/.cache/franken_ts), including
      # yt-dlp's downloaded-stream cache (franken-ts/AGENTS.md's "assets"
      # section) -- a named volume, not a bind mount, since nothing here is
      # ever handed to the host Docker daemon (unlike the repo mount above,
      # no path-matching constraint applies). Without this, every container
      # recreate re-downloads every stream asset from scratch.
      - franken-ts-cache:/root/.cache/franken_ts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  franken-ts-cache:
